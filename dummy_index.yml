workflows:
  - id: "hr-disable-users"
    label: "HR Disable Users"
    description: "Manage employee account statuses and compliance disabling."
    template: "crud"
    authorized_groups:
      - "3"
    parameters:
      target_object: "users"
      user_id_limitation:
        mode: "scope_groups"
        attribute_name: "nano_admin_is_workflow_scope_group"
      supported_operations:
        - name: "list"
          fields:
            - "id"
            - "name"
            - "email"
        - name: "update"
          fields:
            - "is_disabled"
          values:
            is_disabled: true

  - id: "create-new-connections"
    label: "Create New Connections"
    description: "Provision and inspect database connection configurations."
    template: "crud"
    authorized_groups:
      - "developer-group-id"
    parameters:
      target_object: "connections"
      supported_operations:
        - name: "read"
          fields:
            - "name"
        - name: "list"
          fields:
            - "name"
        - name: "create"
          fields:
            - "*"

  - id: "kill-long-running-queries"
    label: "Terminate Long-Running Queries"
    description: "Scan active Looker queries and terminate runs exceeding 10 minutes."
    template: "kill-queries"
    authorized_groups:
      - "1"
    parameters:
      min_runtime_seconds: 600

  - id: "limited-history-audit"
    label: "Limited System Activity Audit"
    description: "Inspect query activity history with tenant user filtering and date limits."
    template: "limited-system-activity"
    authorized_groups:
      - "1"
      - "3"
    parameters:
      explores:
        - name: "history"
          allow_csv_export: true
          required_filter_fields:
            - "history.created_time"
          max_row_limit: 500
        - name: "user"
          allow_csv_export: false
          max_row_limit: 200
        - name: "dashboard"
          allow_csv_export: true
          max_row_limit: 100
      user_id_limitation:
        enabled: true
        mode: "scope_groups"
        attribute_name: "nano_admin_is_workflow_scope_group"

  - id: "workflow-groups-manager"
    label: "Workflow Groups Manager"
    description: "Audit and administer Looker Scope Groups and Workflow Access."
    template: "workflow-groups-manager"
    authorized_groups:
      - "1"
    parameters:
      default_attribute_name: "nano_admin_is_workflow_scope_group"

  - id: "team-user-management"
    label: "Team User Management"
    description: "Comprehensive delegated administration of users, scope groups, roles, attributes, folder access, and schedules."
    template: "user-management"
    authorized_groups:
      - "1"
      - "3"
    parameters:
      user_id_limitation:
        mode: "scope_groups"
        attribute_name: "nano_admin_is_workflow_scope_group"
      profile:
        allow_create: true
        allow_update_name: true
        allow_update_email: false
        allow_disable: true
        allow_delete: false
      groups:
        allow_view: true
        allow_edit: true
      roles:
        allow_view: true
        allow_edit: true
      user_attributes:
        allow_view: true
        allow_edit: true
      folder_access:
        allow_view: true
        allow_edit: true
      credentials:
        allow_password_reset: true
        allow_email_credentials: true
        allow_totp_reset: true
        allow_revoke_sessions: true
      telemetry:
        allow_view_metrics: true
        allow_manage_schedules: true


